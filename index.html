<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#07051c" />
  <meta name="description" content="Retro Rocket Rush — neon arcade space runner. Dodge, blast, and bomb cosmic threats." />
  <title>Rocket Rush — Retro Arcade</title>
  <link rel="stylesheet" href="src/css/styles.css" />
</head>
<body>
<main class="cabinet" aria-label="Retro Rocket Rush arcade cabinet">

  <!-- ─── Top HUD bar ─── -->
  <section class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <div class="title">Rocket Rush</div>
        <div class="subtitle">Galactic Threat Edition</div>
      </div>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><span class="label">Score</span><span class="value" id="score">000000</span></div>
      <div class="stat"><span class="label">Best</span><span class="value" id="best">000000</span></div>
      <div class="stat"><span class="label">Lives</span><span class="value" id="lives">♥♥♥</span></div>
      <div class="stat"><span class="label">Level</span><span class="value" id="level">01</span></div>
      <div class="stat"><span class="label">Shield</span><span class="value" id="shield">000%</span></div>
      <div class="stat"><span class="label">Bombs</span><span class="value" id="bombs">01</span></div>
      <div class="stat boost-stat"><span class="label">Boost</span><span class="value" id="boost">100%</span><span class="meter"><span class="meter-fill" id="boost-fill"></span></span></div>
    </div>
  </section>

  <!-- ─── Game canvas ─── -->
  <section class="game-wrap" id="game-wrap">
    <canvas id="game" aria-label="Rocket game canvas"></canvas>
    <div class="toast" id="toast">MISSION START</div>

    <!-- Touch controls (auto-shown on coarse pointer devices) -->
    <div class="touch" id="touch" aria-hidden="true">
      <div class="pad">
        <button class="ctrl" id="btn-up"    aria-label="Up">▲</button>
        <button class="ctrl" id="btn-left"  aria-label="Left">◀</button>
        <button class="ctrl" id="btn-right" aria-label="Right">▶</button>
        <button class="ctrl" id="btn-down"  aria-label="Down">▼</button>
      </div>
      <div class="actions">
        <button class="ctrl act" id="btn-shoot" aria-label="Shoot">⚡</button>
        <button class="ctrl act" id="btn-bomb"  aria-label="Bomb">💣</button>
        <button class="ctrl act" id="btn-turbo" aria-label="Turbo">🚀</button>
      </div>
    </div>

    <!-- Menu / pause / game over modal -->
    <div class="overlay" id="overlay">
      <div class="modal" id="modal"></div>
    </div>
  </section>

  <!-- ─── Bottom status / hint bar ─── -->
  <section class="bottombar">
    <span class="status-pill"><span class="led"></span> Controls armed</span>
    <span>Tip: Turbo speeds the world up — but spawns more chaos.</span>
    <span>Controls: WASD/Arrows · Space turbo · J/Z or Left Click shoot · B/X or Right Click bomb · P/M/R</span>
  </section>
</main>

<!-- ─── Scripts (load order matters; no bundler required) ─── -->
<script src="src/js/core/config.js"></script>
<script src="src/js/utils.js"></script>
<script src="src/js/core/state.js"></script>
<script src="src/js/systems/audio.js"></script>
<script src="src/js/systems/input.js"></script>
<script src="src/js/systems/effects.js"></script>
<script src="src/js/entities/entities.js"></script>
<script src="src/js/entities/spawn.js"></script>
<script src="src/js/entities/bosses.js"></script>
<script src="src/js/systems/render.js"></script>
<script src="src/js/ui/ui.js"></script>
<script src="src/js/core/game.js"></script>
<script>RR.game.boot();</script>
</body>
</html>
